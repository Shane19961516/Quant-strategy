name: Daily Strategy WeChat Notify

# 北京时间 19:00–23:00 多档尝试（GitHub cron 常延迟数小时，避免凌晨误推）：
# - 周一至周五：本周持仓 + 盈亏 + 折线图
# - 周六：加推下周一调仓目标
# 规则：schedule 仅在 CST 19:00–23:00 且当天尚未成功推送时发送；手动 Run 不受限
# UTC 11–15 = CST 19:00–23:00
on:
  schedule:
    - cron: "0 11 * * 1-6"
    - cron: "30 11 * * 1-6"
    - cron: "0 12 * * 1-6"
    - cron: "30 12 * * 1-6"
    - cron: "0 13 * * 1-6"
    - cron: "30 13 * * 1-6"
    - cron: "0 14 * * 1-6"
    - cron: "30 14 * * 1-6"
    - cron: "0 15 * * 1-6"
    - cron: "30 15 * * 1-6"
  workflow_dispatch:

concurrency:
  group: daily-strategy-wechat-notify
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: multi_asset_rotation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate schedule slot (19:00–23:00 CST, once per day)
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          today = now.date().isoformat()
          cur = int(os.environ["GITHUB_RUN_ID"])
          repo = os.environ["GITHUB_REPOSITORY"]

          def run_pushed_ok(run_id: int) -> bool:
              proc = subprocess.run(
                  ["gh", "run", "view", str(run_id), "-R", repo, "--log"],
                  capture_output=True,
                  text=True,
                  timeout=180,
              )
              if proc.returncode != 0:
                  return False
              log = proc.stdout
              if "[daily_notify] push result:" not in log:
                  return False
              return '"code": 200' in log or "'code': 200" in log

          if now.hour < 19:
              skip = True
              reason = f"before 19:00 CST (now {now.strftime('%H:%M')})"
              prior = 0
          elif now.hour >= 23 and now.minute >= 30:
              skip = True
              reason = f"after 23:30 CST (now {now.strftime('%H:%M')})"
              prior = 0
          else:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "run",
                      "list",
                      "-R",
                      repo,
                      "--workflow",
                      "Daily Strategy WeChat Notify",
                      "--branch",
                      "master",
                      "--limit",
                      "60",
                      "--json",
                      "databaseId,conclusion,createdAt,status,event",
                  ],
                  text=True,
              )
              runs = json.loads(raw)
              prior = 0
              for r in runs:
                  rid = int(r["databaseId"])
                  if rid == cur:
                      continue
                  if r.get("conclusion") != "success":
                      continue
                  created = datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
                  local = created.astimezone(ZoneInfo("Asia/Shanghai"))
                  if local.date().isoformat() != today:
                      continue
                  if run_pushed_ok(rid):
                      prior += 1
              skip = prior > 0
              reason = f"prior_pushed_today={prior}" if skip else "ready to send"

          print(f"[gate] shanghai_today={today} {reason} skip={skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Setup Python
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: multi_asset_rotation/requirements.txt

      - name: Install deps
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run daily notify
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECHAT_PHONE: ${{ secrets.WECHAT_PHONE }}
          NOTIFY_FORCE_DOWNLOAD: "1"
        run: |
          export PUSHPLUS_CHANNEL="${PUSHPLUS_CHANNEL:-wechat}"
          export WECHAT_PHONE="${WECHAT_PHONE:-15111101843}"
          python daily_notify.py

      - name: Upload report artifact
        if: (github.event_name != 'schedule' || steps.gate.outputs.skip != 'true') && always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-notify-${{ github.run_id }}
          path: |
            multi_asset_rotation/output/daily_notify_latest.txt
            multi_asset_rotation/output/daily_notify_latest.html
            multi_asset_rotation/output/daily_notify_latest.json
            multi_asset_rotation/output/daily_notify_push_result.json
            multi_asset_rotation/output/ytd_nav_*.png
          if-no-files-found: warn

      - name: Skipped this slot
        if: github.event_name == 'schedule' && steps.gate.outputs.skip == 'true'
        run: echo "Skip — outside 19:00–23:30 CST window or already notified today."
