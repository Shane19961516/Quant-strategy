name: Daily Strategy WeChat Notify

# GitHub cron 常延迟 4–8 小时。策略：
# - 晚间窗 19:00–23:59 CST：推送当日报告
# - 凌晨补发窗 00:00–11:59 CST：若昨日未推成功，补发昨日报告
# - 去重只认日志中的 NOTIFY_PUSH_OK:::YYYY-MM-DD（避免匹配门禁源码误判）
# - 手动 Run workflow 不受时间窗限制
# 预定 UTC 10–15 = 期望 CST 18–23；延迟后常落到次日凌晨，由补发窗承接
on:
  schedule:
    - cron: "0 10 * * 1-6"
    - cron: "30 10 * * 1-6"
    - cron: "0 11 * * 1-6"
    - cron: "30 11 * * 1-6"
    - cron: "0 12 * * 1-6"
    - cron: "30 12 * * 1-6"
    - cron: "0 13 * * 1-6"
    - cron: "30 13 * * 1-6"
    - cron: "0 14 * * 1-6"
    - cron: "30 14 * * 1-6"
    - cron: "0 15 * * 1-6"
    - cron: "30 15 * * 1-6"
  workflow_dispatch:

concurrency:
  group: daily-strategy-wechat-notify
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: multi_asset_rotation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate schedule slot (evening + morning catch-up)
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          today = now.date()
          cur = int(os.environ["GITHUB_RUN_ID"])
          repo = os.environ["GITHUB_REPOSITORY"]

          # Mon=0 … Sun=6；周日不推送
          def is_notify_day(d) -> bool:
              return d.weekday() <= 5

          if 19 <= now.hour <= 23:
              report_day = today
              mode = "evening"
          elif now.hour < 12:
              report_day = today - timedelta(days=1)
              mode = "catchup"
          else:
              print(f"[gate] skip midday wait-for-evening now={now.strftime('%F %H:%M')}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("skip=true\n")
                  f.write("report_day=\n")
              raise SystemExit(0)

          if not is_notify_day(report_day):
              print(f"[gate] skip non-notify report_day={report_day} mode={mode}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("skip=true\n")
                  f.write("report_day=\n")
              raise SystemExit(0)

          report_day_s = report_day.isoformat()
          marker = "NOTIFY_PUSH_OK:::" + report_day_s

          def run_has_marker(run_id: int) -> bool:
              proc = subprocess.run(
                  ["gh", "run", "view", str(run_id), "-R", repo, "--log"],
                  capture_output=True,
                  text=True,
                  timeout=180,
              )
              if proc.returncode != 0:
                  return False
              return marker in proc.stdout

          raw = subprocess.check_output(
              [
                  "gh",
                  "run",
                  "list",
                  "-R",
                  repo,
                  "--workflow",
                  "Daily Strategy WeChat Notify",
                  "--branch",
                  "master",
                  "--limit",
                  "80",
                  "--json",
                  "databaseId,conclusion,createdAt,updatedAt,event",
              ],
              text=True,
          )
          runs = json.loads(raw)
          prior = 0
          for r in runs:
              rid = int(r["databaseId"])
              if rid == cur:
                  continue
              if r.get("conclusion") != "success":
                  continue
              # 纯 skip 约 8–15s；真推送约 60s+，先过滤缩短日志拉取
              created = datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
              updated = datetime.fromisoformat(r["updatedAt"].replace("Z", "+00:00"))
              if (updated - created).total_seconds() < 40:
                  continue
              if run_has_marker(rid):
                  prior += 1
                  break

          skip = prior > 0
          reason = (
              f"already_pushed {marker}"
              if skip
              else f"ready mode={mode} report_day={report_day_s}"
          )
          print(f"[gate] now={now.strftime('%F %H:%M')} {reason} skip={skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
              f.write(f"report_day={report_day_s}\n")
          PY

      - name: Setup Python
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: multi_asset_rotation/requirements.txt

      - name: Install deps
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run daily notify
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          REPORT_DAY: ${{ steps.gate.outputs.report_day }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECHAT_PHONE: ${{ secrets.WECHAT_PHONE }}
          NOTIFY_FORCE_DOWNLOAD: "1"
        run: |
          export PUSHPLUS_CHANNEL="${PUSHPLUS_CHANNEL:-wechat}"
          export WECHAT_PHONE="${WECHAT_PHONE:-15111101843}"
          # 手动 Run 时 gate 未跑，REPORT_DAY 为空 → 用当天
          if [ -z "${REPORT_DAY:-}" ]; then
            REPORT_DAY="$(TZ=Asia/Shanghai date +%F)"
            export REPORT_DAY
          fi
          echo "[notify] REPORT_DAY=$REPORT_DAY"
          python daily_notify.py

      - name: Upload report artifact
        if: (github.event_name != 'schedule' || steps.gate.outputs.skip != 'true') && always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-notify-${{ github.run_id }}
          path: |
            multi_asset_rotation/output/daily_notify_latest.txt
            multi_asset_rotation/output/daily_notify_latest.html
            multi_asset_rotation/output/daily_notify_latest.json
            multi_asset_rotation/output/daily_notify_push_result.json
            multi_asset_rotation/output/ytd_nav_*.png
          if-no-files-found: warn

      - name: Skipped this slot
        if: github.event_name == 'schedule' && steps.gate.outputs.skip == 'true'
        run: echo "Skip — outside send window, non-notify day, or already pushed for report_day."
